# Permissive-LOOKING but INVALID: the `budget` key is misspelled `budjets`.
# A lenient reader would ignore the unknown key and grant the full tool/write/command surface with
# NO budget cap — the exact fail-open this fixture exists to catch. Must DENY (`policy_unknown_key`).
version: 1
tools:
  allow: [read_files, search_codebase, editor, apply_patch, run_commands]
  deny: []
write_scope:
  paths: ["**"]
command_allow_list:
  commands: [pytest, git, make]
budjets:
  max_cost_usd: 5.0
